commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,json,md,yml,yaml}'
      run: npx --no -- prettier --check {staged_files}
    lint:
      glob: '*.ts'
      run: npx --no -- eslint --max-warnings=0 {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    unit-tests:
      run: npm run test:unit
